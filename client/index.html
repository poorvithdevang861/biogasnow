<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biogas Trust & Adoption Platform</title>
    <meta name="description" content="Transparent, evidence-based matching for waste providers, biogas consumers, and plant engineers." />
    <!-- Single Page Apps for GitHub Pages redirect restoration -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-[#FBFBFA] text-zinc-900 antialiased font-sans selection:bg-emerald-100 selection:text-emerald-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
